[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leetgpu-xpu-runner"
version = "0.1.0"
description = "Local Intel XPU grader for LeetGPU SYCL submissions"
requires-python = ">=3.10"

[project.scripts]
xpu-grade = "tools.grade:main"

[tool.setuptools]
packages = ["runner", "tools"]
